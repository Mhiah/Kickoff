# A rehearsal of Kickoff's robot on a private copy of X Layer mainnet.
#
# The robot's wallet becomes a league, three phones enter sealed picks through Kickoff's own server
# code, and the robot announces, locks, records results and publishes opened picks through
# TapeOut's real mailbox and site store. It signs with `cast`, exactly as it will for real, using
# a throwaway key made for this run. Then the table is rebuilt from the copy of X Layer alone.
# Nothing is sent to the real network and nothing is paid.
name: Robot rehearsal

on:
  push:
    paths:
      - "robot/**"
      - "engine/src/**"
      - "server/src/**"
      - "circuits/out/**"
      - ".github/workflows/robot-rehearsal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearse:
    name: The robot works a season on a copy of X Layer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      XLAYER_RPC_URL: https://rpc.xlayer.tech
      COPY: http://127.0.0.1:8545
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Start a private copy of X Layer
        run: |
          anvil --fork-url "$XLAYER_RPC_URL" --port 8545 --retries 10 > anvil.log 2>&1 &
          for i in $(seq 1 60); do
            if cast chain-id --rpc-url "$COPY" > /dev/null 2>&1; then break; fi
            sleep 1
          done
          echo "The copy is of chain $(cast chain-id --rpc-url "$COPY"), at block $(cast block-number --rpc-url "$COPY")"

      - name: The robot's rehearsal
        run: |
          # A key made for this run only. It never holds real money and is thrown away afterwards.
          KEY="0x$(openssl rand -hex 32)"
          echo "::add-mask::$KEY"
          node robot/scripts/rehearse.js --node "$COPY" --cast-key "$KEY" --summary rehearsal.md

      - name: Put the output on the run's summary page
        if: always()
        run: |
          {
            echo '## The robot on a private copy of X Layer'
            echo '```'
            cat rehearsal.md 2>/dev/null || echo 'the rehearsal did not finish'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show the copy's log if something went wrong
        if: failure()
        run: tail -n 60 anvil.log

  golive:
    name: Going live and publishing the website, rehearsed on a copy of X Layer
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      XLAYER_RPC_URL: http://127.0.0.1:8545
      # Only read, to check that the league this makes is the one Kickoff's server is set up for.
      KICKOFF_SERVER: https://kickoff-two-xi.vercel.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Start a private copy of X Layer
        run: |
          anvil --fork-url https://rpc.xlayer.tech --port 8545 --retries 10 > anvil.log 2>&1 &
          for i in $(seq 1 60); do
            if cast chain-id --rpc-url "$XLAYER_RPC_URL" > /dev/null 2>&1; then break; fi
            sleep 1
          done
          echo "The copy is of chain $(cast chain-id --rpc-url "$XLAYER_RPC_URL"), at block $(cast block-number --rpc-url "$XLAYER_RPC_URL")"

      - name: Go live on the copy, with a throwaway wallet
        run: |
          # A key made for this run only. It never holds real money and is thrown away afterwards.
          export KICKOFF_WALLET_KEY="0x$(openssl rand -hex 32)"
          echo "::add-mask::$KICKOFF_WALLET_KEY"
          wallet=$(cast wallet address --private-key "$KICKOFF_WALLET_KEY")

          echo "== An empty wallet: the look says it is short, and going live sends nothing"
          node robot/bin/golive.js look | tee look-empty.txt
          grep -q "THE WALLET IS SHORT BY" look-empty.txt
          if node robot/bin/golive.js go --confirm "GO LIVE" > go-empty.txt; then echo "it went live with an empty wallet"; exit 1; fi
          grep -q "so nothing was sent" go-empty.txt
          test "$(cast nonce "$wallet" --rpc-url "$XLAYER_RPC_URL")" = "0"

          # The copy quotes a far higher gas price than the real X Layer does, so the wallet is
          # given more test money than the real one will need.
          echo "== Test money on the copy: 1 OKB"
          cast rpc anvil_setBalance "$wallet" 0xde0b6b3a7640000 --rpc-url "$XLAYER_RPC_URL" > /dev/null
          node robot/bin/golive.js look | tee look.txt
          grep -q "The wallet holds enough." look.txt

          echo "== Without the words GO LIVE, nothing is sent"
          if node robot/bin/golive.js go --confirm "yes"; then echo "it went live without being asked properly"; exit 1; fi
          test "$(cast nonce "$wallet" --rpc-url "$XLAYER_RPC_URL")" = "0"

          # Kickoff is live on the real X Layer, so the league a throwaway wallet would make here is
          # a new one, not the one Kickoff's server is set up for. Going live has to refuse that
          # unless it is told a new league is wanted.
          echo "== A league that is not the server's: nothing is sent"
          if node robot/bin/golive.js go --confirm "GO LIVE" > go-other.txt; then echo "it made a league the server is not set up for"; exit 1; fi
          grep -q "not the one Kickoff's server is set up for, so nothing was sent" go-other.txt
          test "$(cast nonce "$wallet" --rpc-url "$XLAYER_RPC_URL")" = "0"

          echo "== Going live, as a new league"
          node robot/bin/golive.js go --confirm "GO LIVE" --new-league | tee go.txt
          grep -q "Kickoff is live." go.txt
          left=$(cast balance "$wallet" --rpc-url "$XLAYER_RPC_URL")

          echo "== Going live a second time sends nothing and pays nothing"
          node robot/bin/golive.js go --confirm "GO LIVE" --new-league | tee again.txt
          grep -q "There was nothing left to do, so nothing was sent." again.txt
          test "$(cast balance "$wallet" --rpc-url "$XLAYER_RPC_URL")" = "$left"

          # The website itself, put on the copy of X Layer in that league's account by the same
          # wallet: TapeOut's real site store and its real contract for names.
          echo "== The website: a look, with test money for the gas"
          export KICKOFF_CIRCUIT=$(grep -oE 'KICKOFF_CIRCUIT +[0-9]+' go.txt | grep -oE '[0-9]+$')
          cast rpc anvil_setBalance "$wallet" 0x8ac7230489e80000 --rpc-url "$XLAYER_RPC_URL" > /dev/null
          node robot/bin/site.js look | tee site-look.txt
          grep -q "The wallet holds enough." site-look.txt
          name=$(grep -oE '[0-9]+\.2\.[0-9]+\.tape' site-look.txt | head -n 1)
          account=$(grep -oE "league's account, 0x[0-9a-f]{40}" site-look.txt | grep -oE '0x[0-9a-f]{40}')
          sent=$(cast nonce "$wallet" --rpc-url "$XLAYER_RPC_URL")

          echo "== Without the words PUBLISH SITE, nothing is sent"
          if node robot/bin/site.js go --confirm "yes"; then echo "it published without being asked properly"; exit 1; fi
          test "$(cast nonce "$wallet" --rpc-url "$XLAYER_RPC_URL")" = "$sent"

          echo "== Publishing the site"
          node robot/bin/site.js go --confirm "PUBLISH SITE" | tee site-go.txt
          grep -q "The site is on X Layer." site-go.txt

          echo "== Every file read back whole from the copy of X Layer"
          node robot/bin/site.js check | tee site-check.txt
          grep -q "files on X Layer are the same as the files here." site-check.txt

          echo "== TapeOut's own contract says the name $name is switched on"
          test "$(cast call 0x68809fd2fb343aa57d0aeb7f33defe477c9666f9 'isLive(string,address)(bool)' "$name" "$account" --rpc-url "$XLAYER_RPC_URL")" = "true"

          echo "== Publishing a second time sends nothing and pays nothing"
          left=$(cast balance "$wallet" --rpc-url "$XLAYER_RPC_URL")
          node robot/bin/site.js go --confirm "PUBLISH SITE" | tee site-again.txt
          grep -q "There was nothing left to do, so nothing was sent." site-again.txt
          test "$(cast balance "$wallet" --rpc-url "$XLAYER_RPC_URL")" = "$left"

      - name: Show the copy's log if something went wrong
        if: failure()
        run: tail -n 60 anvil.log
