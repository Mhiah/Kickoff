# Kickoff's robot.
#
# Every half hour it makes Kickoff's list of matches agree with the two sports feeds: new matches
# are added, finished ones get their score, postponed ones are called off. Once it has a wallet it
# also does Kickoff's work on X Layer: it locks each match's sealed picks before kickoff, records
# each result, and publishes the opened picks. What it did is on each run's own page.
#
# How it keeps going: GitHub's own timer proved unreliable for this (it did not fire at all in the
# robot's first seven hours). So the robot keeps itself awake. One run works for about five and a
# half hours, doing its job every half hour, then starts the next run and stops. GitHub's timer is
# kept only as a safety net: every two hours it checks whether the robot is awake, and starts it
# if it is not.
#
# Its secrets are set in the repository's settings and written nowhere else:
#   KICKOFF_ADMIN_KEY    the robot's key, which Kickoff's server also holds
#   FOOTBALL_DATA_KEY    the football feed's key
#   BALLDONTLIE_KEY      the basketball feed's key
#   KICKOFF_WALLET_KEY   the private key of the robot's wallet on X Layer
# and two settings that are not secret (repository variables):
#   KICKOFF_PROCESSOR, KICKOFF_CIRCUIT   which TapeOut circuit is the league
# Until KICKOFF_ADMIN_KEY is set it only looks. Until the wallet is set it writes nothing to X Layer.
name: Robot

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only say what would change, once, and change nothing"
        type: boolean
        default: false
      handover:
        description: "Started by the previous run (leave unticked)"
        type: boolean
        default: false
  push:
    paths:
      - "robot/**"
      - "feed/src/**"
      - "engine/src/**"
      - "server/src/**"
      - ".github/workflows/robot.yml"
  pull_request:

permissions:
  contents: read
  actions: write # only to start its own next run

jobs:
  test:
    name: Test the robot
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the tests
        run: node --test "robot/test/*.test.js"

  look:
    name: Say what would change, and change nothing
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KICKOFF_SERVER: https://kickoff-two-xi.vercel.app
      FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
      BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node robot/bin/robot.js fixtures --dry-run

  awake:
    name: Keep Kickoff's list of matches up to date
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      KICKOFF_SERVER: https://kickoff-two-xi.vercel.app
      KICKOFF_ADMIN_KEY: ${{ secrets.KICKOFF_ADMIN_KEY }}
      FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
      BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
      # The robot's wallet on X Layer. Until all three are set, nothing is written to X Layer.
      KICKOFF_WALLET_KEY: ${{ secrets.KICKOFF_WALLET_KEY }}
      KICKOFF_PROCESSOR: ${{ vars.KICKOFF_PROCESSOR }}
      KICKOFF_CIRCUIT: ${{ vars.KICKOFF_CIRCUIT }}
      GH_TOKEN: ${{ github.token }}
      HANDOVER: ${{ inputs.handover }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Is the robot already awake?
        id: check
        run: |
          # Another run of the robot that is working right now, other than this one. Test runs do not count.
          others=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow robot.yml --status in_progress --limit 20 --json databaseId,event \
            --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and (.event == \"schedule\" or .event == \"workflow_dispatch\"))] | length")
          if [ "$HANDOVER" = "true" ]; then
            echo "Started by the previous run, which is finishing."
            echo "go=yes" >> "$GITHUB_OUTPUT"
          elif [ "$others" = "0" ]; then
            echo "The robot was asleep. Waking it."
            echo "go=yes" >> "$GITHUB_OUTPUT"
          else
            echo "The robot is already awake, so there is nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "go=no" >> "$GITHUB_OUTPUT"
          fi

      # `cast` signs what the robot writes to X Layer. It is only used once the robot has a wallet.
      - uses: foundry-rs/foundry-toolchain@v1
        if: steps.check.outputs.go == 'yes'

      - name: Stay awake and do the work
        if: steps.check.outputs.go == 'yes'
        run: node robot/bin/robot.js watch --minutes 320

      - name: Start the next run
        if: always() && steps.check.outputs.go == 'yes'
        run: gh workflow run robot.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f handover=true
