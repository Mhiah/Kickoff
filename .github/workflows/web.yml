# Runs the website's checks on every change to it, and on every change to the picks engine, because
# the site carries a copy of the engine's sealing code that has to match it exactly, and on every
# change to the server, because the site's group checks run against the server's own code.
name: Website checks

on:
  push:
    paths:
      - "web/**"
      - "engine/src/**"
      - "server/src/**"
      - ".github/workflows/web.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Check the website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run the checks
        run: node --test "web/test/*.test.js"
