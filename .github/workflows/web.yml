# Runs the website's checks on every change to it.
name: Website checks

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Check the website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run the checks
        run: node --test "web/test/*.test.js"
